<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blur24" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="blur12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <linearGradient id="blobBlue" x1="690" y1="450" x2="1480" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF4FD">
      </stop>
      <stop offset="55%" stop-color="#DCE9FB">
      </stop>
      <stop offset="100%" stop-color="#F5F8FC">
      </stop>
    </linearGradient>

    <linearGradient id="blobGreen" x1="980" y1="90" x2="1310" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F8F5">
      </stop>
      <stop offset="100%" stop-color="#DDEADF">
      </stop>
    </linearGradient>

    <linearGradient id="blobLayer" x1="760" y1="620" x2="1520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFD" stop-opacity="0.85">
      </stop>
      <stop offset="100%" stop-color="#D8E5F2" stop-opacity="0.9">
      </stop>
    </linearGradient>

    <linearGradient id="strokeGrad" x1="620" y1="640" x2="1570" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8C6F3" stop-opacity="0.15">
      </stop>
      <stop offset="50%" stop-color="#9BC2F2" stop-opacity="0.55">
      </stop>
      <stop offset="100%" stop-color="#CFE2FA" stop-opacity="0.2">
      </stop>
    </linearGradient>

    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAF2FE">
      </stop>
      <stop offset="100%" stop-color="#D7E6FB">
      </stop>
    </radialGradient>
  </defs>

  <style>
    /* Play once so the artwork settles while visitors read. */
    .tSlow { transform-box: fill-box; transform-origin: center; }
    .tMid { transform-box: fill-box; transform-origin: center; }
    .tFast { transform-box: fill-box; transform-origin: center; }

    .floatA { animation: floatA 4.2s ease-in-out 1; }
    .floatB { animation: floatB 4.6s ease-in-out 1; }
    .floatC { animation: floatC 4.8s ease-in-out 1; }
    .floatD { animation: floatD 3.5s ease-in-out 1; }
    .pulseA { animation: pulseA 4.6s ease-in-out 1; }
    .pulseB { animation: pulseB 3.8s ease-in-out 1; }
    .dotsA { animation: dotsA 3.4s ease-in-out 1; }
    .dotsB { animation: dotsB 4.2s ease-in-out 1; }

    @keyframes floatA {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      25% { transform: translate(45px, -34px) rotate(2.8deg) scale(1.045); }
      50% { transform: translate(-32px, 29px) rotate(-2.2deg) scale(0.97); }
      75% { transform: translate(30px, 18px) rotate(1.8deg) scale(1.025); }
    }
    @keyframes floatB {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      30% { transform: translate(-30px, 30px) rotate(-2.5deg) scale(1.05); }
      60% { transform: translate(35px, -26px) rotate(2.4deg) scale(0.98); }
    }
    @keyframes floatC {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -22px) scale(1.06); }
      66% { transform: translate(-24px, 23px) scale(0.97); }
    }
    @keyframes floatD {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(32px, -30px); }
    }
    @keyframes pulseA {
      0%,100% { opacity: .72; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes pulseB {
      0%,100% { opacity: .55; transform: scale(1); }
      50% { opacity: .93; transform: scale(1.22); }
    }
    @keyframes dotsA {
      0%,100% { opacity: .45; }
      50% { opacity: .95; }
    }
    @keyframes dotsB {
      0%,100% { opacity: .35; transform: translateY(0px); }
      50% { opacity: .85; transform: translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .floatA, .floatB, .floatC, .floatD, .pulseA, .pulseB, .dotsA, .dotsB { animation: none !important; }
    }
  </style>

  <!-- large empty area on the left for text -->
  <rect x="0" y="0" width="1600" height="900" fill="transparent"/>

  <g opacity="0.96">
    <!-- back soft green form -->
    <g class="tSlow floatB" filter="url(#blur24)">
      <path d="M1086 112C1174 98 1248 133 1296 202C1344 272 1360 366 1320 433C1278 503 1185 536 1104 508C1022 480 981 392 972 313C962 230 996 148 1086 112Z" fill="url(#blobGreen)" fill-opacity="0.72"/>
    </g>

    <!-- main hero blob -->
    <g class="tSlow floatA" filter="url(#blur12)">
      <path d="M736 544C770 468 858 430 960 435C1036 439 1084 425 1134 368C1207 285 1321 260 1412 308C1502 356 1549 469 1520 566C1490 664 1390 726 1286 718C1213 712 1162 723 1094 774C1006 839 889 846 803 803C693 747 689 646 736 544Z" fill="url(#blobBlue)" fill-opacity="0.9"/>
    </g>

    <!-- lower translucent layer -->
    <g class="tMid floatC" filter="url(#blur24)">
      <path d="M786 720C862 642 964 612 1077 586C1189 560 1300 516 1408 483C1472 463 1540 472 1576 520C1611 568 1606 633 1560 676C1513 720 1428 739 1348 755C1261 773 1182 793 1102 822C992 862 886 878 811 839C738 801 719 788 722 767C725 746 748 760 786 720Z" fill="url(#blobLayer)" fill-opacity="0.9"/>
    </g>

    <!-- wave lines -->
    <g opacity="0.92">
      <path d="M676 745C770 683 879 657 987 684C1106 715 1197 725 1289 648C1380 571 1463 412 1600 369" stroke="url(#strokeGrad)" stroke-width="3.1" stroke-linecap="round">
      </path>

      <path d="M728 690C832 629 929 623 1018 647C1108 672 1195 671 1277 612C1355 556 1424 500 1504 461" stroke="url(#strokeGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
      </path>
    </g>

    <!-- accent circles -->
    <g class="tFast pulseA">
      <circle cx="1430" cy="146" r="56" fill="url(#orbGrad)" fill-opacity="0.95"/>
    </g>
    <g class="tFast pulseB">
      <circle cx="1202" cy="754" r="78" fill="#DCE8FA" fill-opacity="0.78"/>
    </g>
    <g class="tFast floatD">
      <circle cx="953" cy="378" r="18" fill="#DCEFE0" fill-opacity="0.92"/>
    </g>
    <g class="tFast pulseA">
      <circle cx="1460" cy="635" r="16" fill="#D7E6FA" fill-opacity="0.85"/>
    </g>

    <!-- dotted grids -->
    <g class="dotsA" fill="#A8C6F0" fill-opacity="0.9">
      <g transform="translate(958 188)">
        <circle cx="0" cy="0" r="3.4"/><circle cx="28" cy="0" r="3.4"/><circle cx="56" cy="0" r="3.4"/><circle cx="84" cy="0" r="3.4"/>
        <circle cx="0" cy="28" r="3.4"/><circle cx="28" cy="28" r="3.4"/><circle cx="56" cy="28" r="3.4"/><circle cx="84" cy="28" r="3.4"/>
        <circle cx="0" cy="56" r="3.4"/><circle cx="28" cy="56" r="3.4"/><circle cx="56" cy="56" r="3.4"/><circle cx="84" cy="56" r="3.4"/>
      </g>
    </g>
    <g class="dotsB" fill="#A9C7EF" fill-opacity="0.85">
      <g transform="translate(1335 708)">
        <circle cx="0" cy="0" r="3.4"/><circle cx="28" cy="0" r="3.4"/><circle cx="56" cy="0" r="3.4"/><circle cx="84" cy="0" r="3.4"/>
        <circle cx="0" cy="28" r="3.4"/><circle cx="28" cy="28" r="3.4"/><circle cx="56" cy="28" r="3.4"/><circle cx="84" cy="28" r="3.4"/>
        <circle cx="0" cy="56" r="3.4"/><circle cx="28" cy="56" r="3.4"/><circle cx="56" cy="56" r="3.4"/><circle cx="84" cy="56" r="3.4"/>
      </g>
    </g>
  </g>
</svg>
